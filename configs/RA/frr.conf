! RA - Site A router
! Baseline configuration: OSPF area 0, default OSPF timers.
!
frr defaults traditional
hostname RA
log file /var/log/frr/frr.log informational
log timestamp precision 3
service integrated-vtysh-config
!
ip forwarding
!
interface lo
 ip address 10.0.0.1/32
 ip ospf area 0
exit
!
interface eth0.10
 description Site A - VLAN 10 Users
 ip address 10.1.10.1/24
 ip ospf area 0
 ip ospf passive
exit
!
interface eth0.20
 description Site A - VLAN 20 Servers
 ip address 10.1.20.1/24
 ip ospf area 0
 ip ospf passive
exit
!
interface eth1
 description WAN primary to RB eth1
 ip address 10.255.1.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
exit
!
interface eth2
 description WAN backup to RB eth2
 ip address 10.255.2.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 100
exit
!
router ospf
 ospf router-id 10.0.0.1
 log-adjacency-changes detail
exit
!
